name: Build lsdriver (DPT enabled)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kmi: android12-5.10, branch: android12-5.10, no_strip: false, ias: 0, cross: aarch64-linux-gnu-, clang: "" }
          - { kmi: android13-5.15, branch: android13-5.15-2024-11, no_strip: false, ias: 1, cross: "", clang: r450784e }
          - { kmi: android14-6.1,  branch: android14-6.1,  no_strip: false, ias: 1, cross: "", clang: "" }
          - { kmi: android15-6.6,  branch: android15-6.6,  no_strip: true, ias: 1, cross: "", clang: "" }
          - { kmi: android16-6.12, branch: android16-6.12, no_strip: true, ias: 1, cross: "", clang: "" }

    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: lsdriver-src

      - name: Restore kernel cache
        uses: actions/cache/restore@v4
        with:
          path: kernel
          key: kernel-${{ matrix.branch }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ matrix.branch }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld bc bison flex \
            libssl-dev libelf-dev dwarves libdw-dev libdwarf-dev elfutils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup matched AOSP clang (${{ matrix.clang }})
        if: matrix.clang != ''
        run: |
          if [ ! -d "$HOME/prebuilts-clang/${{ matrix.clang }}" ]; then
            git clone --depth 1 \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$HOME/prebuilts-clang" || true
          fi
          CLANG_BIN="$HOME/prebuilts-clang/${{ matrix.clang }}/bin"
          if [ -x "$CLANG_BIN/clang" ]; then
            "$CLANG_BIN/clang" --version | head -2
            echo "MATCHED_CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          else
            echo "!! matched clang not available, falling back to system clang"
          fi

      - name: Checkout KMI kernel (${{ matrix.kmi }})
        run: |
          if [ ! -f kernel/Makefile ]; then
            git clone --depth 3000 \
              https://android.googlesource.com/kernel/common \
              -b ${{ matrix.branch }} \
              kernel
          else
            echo "kernel cache hit, skip clone"
          fi
          cd kernel
          if [ "${{ matrix.kmi }}" = "android13-5.15" ]; then
            C=$(git log --format="%H %s" | grep -m1 "5.15.167" | cut -d' ' -f1)
            if [ -n "$C" ]; then
              git checkout "$C"
              echo "checked out 5.15.167: $C"
            else
              echo "5.15.167 commit not found in depth, using branch HEAD"
            fi
            grep -m1 -E "SUBLEVEL" Makefile || true
          fi
          git log --oneline -1

      - name: Prepare kernel build
        run: |
          cd kernel
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} gki_defconfig
          # 关闭 rust 相关(部分版本 defconfig 带且 runner 工具链不匹配)
          ./scripts/config --file .config -d RUST -d RUST_BUILD_ASSERT_ALLOW || true
          # 关闭 BTF: 绕过 BTF 生成失败, 省内存/磁盘 (模块符号表不依赖 BTF)
          ./scripts/config --file .config -d DEBUG_INFO_BTF || true
          ./scripts/config --file .config -e DEBUG_INFO_NONE || true
          # 关闭 LTO: GKI LTO 链接 vmlinux.o 会在 16GB runner 上 OOM(exit 143),
          # 模块符号 CRC 由头文件类型决定, 与 LTO 无关
          ./scripts/config --file .config -d LTO_CLANG || true
          ./scripts/config --file .config -d LTO_CLANG_THIN || true
          ./scripts/config --file .config -d LTO_CLANG_FULL || true
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} olddefconfig
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} -j$(nproc) prepare modules_prepare \
            2>&1 | tee prepare.log

      - name: Build full kernel (for Module.symvers)
        run: |
          cd kernel
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} -j$(nproc) all 2>&1 | tee build.log

      - name: Build lsdriver.ko (DPT enabled)
        run: |
          cd kernel
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} -j$(nproc) \
            M=${{ github.workspace }}/lsdriver-src/lsdriver \
            modules 2>&1 | tee mod.log

      - name: Collect errors to summary + errors branch (on failure)
        if: failure()
        run: |
          {
            echo "## ${{ matrix.kmi }} build failure"
            for f in prepare.log build.log mod.log; do
              if [ -f "kernel/$f" ]; then
                echo "=== $f (errors) ==="
                grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal|\*\*\*|FAILED:" \
                  "kernel/$f" | tail -50
                echo "--- tail ---"
                tail -60 "kernel/$f"
              fi
            done
          } > /tmp/summary.md || true
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cd "${{ github.workspace }}/lsdriver-src"
          git config user.name "ci-bot"
          git config user.email "ci@localhost"
          git checkout --orphan "errors/${{ matrix.kmi }}" 2>/dev/null || true
          git rm -rf . 2>/dev/null || true
          cp /tmp/summary.md ./summary.md
          git add summary.md
          git commit -m "build errors ${{ matrix.kmi }}" || true
          git push --force origin "errors/${{ matrix.kmi }}" 2>&1 | tail -2 || true

      - name: Diagnose undefined symbols (on failure)
        if: failure()
        run: |
          echo "=== undefined symbol owners ==="
          for o in $(find "$GITHUB_WORKSPACE/lsdriver-src" -name "*.o" 2>/dev/null); do
            out=$(llvm-nm -u "$o" 2>/dev/null | grep -E "sme_|mmu_notifier|arch_invalidate")
            if [ -n "$out" ]; then
              echo "### $o"
              echo "$out"
            fi
          done
          echo "=== full undefined list of lsdriver_main.o ==="
          llvm-nm -u "$GITHUB_WORKSPACE/lsdriver-src/lsdriver/lsdriver_main.o" 2>/dev/null | head -50

      - name: Strip
        run: |
          KO=$(find "${{ github.workspace }}/lsdriver-src" -name "lsdriver.ko" | head -1)
          if [ -z "$KO" ]; then
            echo "lsdriver.ko not found, searching whole workspace"
            find "${{ github.workspace }}" -name "lsdriver.ko" | head -5
          fi
          if [ "${{ matrix.no_strip }}" = "true" ]; then
            echo "no-strip KMI, keeping symbols"
          else
            llvm-strip --strip-debug "$KO" || strip --strip-debug "$KO"
          fi
          mkdir -p out
          cp "$KO" "out/lsdriver-${{ matrix.kmi }}.ko"
          ls -la out/

      - name: Save kernel cache (always, so failed runs reuse it)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kernel
          key: kernel-${{ matrix.branch }}-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-${{ matrix.kmi }}
          path: out/
