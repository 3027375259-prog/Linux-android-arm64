name: Build lsdriver (DPT enabled)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kmi: android12-5.10, branch: android12-5.10, no_strip: false }
          - { kmi: android13-5.15, branch: android13-5.15, no_strip: false }
          - { kmi: android14-6.1,  branch: android14-6.1,  no_strip: false }
          - { kmi: android15-6.6,  branch: android15-6.6,  no_strip: true }
          - { kmi: android16-6.12, branch: android16-6.12, no_strip: true }

    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: lsdriver-src

      - name: Restore kernel cache
        uses: actions/cache/restore@v4
        with:
          path: kernel
          key: kernel-${{ matrix.branch }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ matrix.branch }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld bc bison flex \
            libssl-dev libelf-dev dwarves

      - name: Checkout KMI kernel (${{ matrix.kmi }})
        run: |
          if [ ! -f kernel/Makefile ]; then
            git clone --depth 1 \
              https://android.googlesource.com/kernel/common \
              -b ${{ matrix.branch }} \
              kernel
          else
            echo "kernel cache hit, skip clone"
          fi
          cd kernel
          git log --oneline -1

      - name: Prepare kernel build
        run: |
          cd kernel
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 gki_defconfig
          # 关闭 rust 相关(部分版本 defconfig 带且 runner 工具链不匹配)
          ./scripts/config --file .config -d RUST -d RUST_BUILD_ASSERT_ALLOW || true
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 olddefconfig
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 -j$(nproc) prepare modules_prepare \
            2>&1 | tee prepare.log

      - name: Build full kernel (for Module.symvers)
        run: |
          cd kernel
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 -j$(nproc) all 2>&1 | tee build.log

      - name: Build lsdriver.ko (DPT enabled)
        run: |
          cd kernel
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 -j$(nproc) \
            M=${{ github.workspace }}/lsdriver-src/lsdriver \
            modules 2>&1 | tee mod.log

      - name: Collect errors to summary + errors branch (on failure)
        if: failure()
        run: |
          {
            echo "## ${{ matrix.kmi }} build failure"
            for f in prepare.log build.log mod.log; do
              if [ -f "kernel/$f" ]; then
                echo "=== $f (errors) ==="
                grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal" \
                  "kernel/$f" | tail -40
                echo "--- tail ---"
                tail -25 "kernel/$f"
              fi
            done
          } > /tmp/summary.md || true
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cd "${{ github.workspace }}/lsdriver-src"
          git config user.name "ci-bot"
          git config user.email "ci@localhost"
          git checkout --orphan "errors/${{ matrix.kmi }}" 2>/dev/null || true
          git rm -rf . 2>/dev/null || true
          cp /tmp/summary.md ./summary.md
          git add summary.md
          git commit -m "build errors ${{ matrix.kmi }}" || true
          git push origin "errors/${{ matrix.kmi }}" || true

      - name: Strip
        run: |
          KO=$(find kernel -name "lsdriver.ko" | head -1)
          if [ "${{ matrix.no_strip }}" = "true" ]; then
            echo "no-strip KMI, keeping symbols"
          else
            llvm-strip --strip-debug "$KO" || strip --strip-debug "$KO"
          fi
          mkdir -p out
          cp "$KO" "out/lsdriver-${{ matrix.kmi }}.ko"
          ls -la out/

      - name: Save kernel cache (always, so failed runs reuse it)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kernel
          key: kernel-${{ matrix.branch }}-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-${{ matrix.kmi }}
          path: out/
