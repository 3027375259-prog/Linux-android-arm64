name: Build lsdriver (PTE, CFI/LTO preserved)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kmi: android12-5.10, branch: android12-5.10, no_strip: false, ias: 0, cross: aarch64-linux-gnu-, clang: "" }
          - { kmi: android13-5.15, branch: android13-5.15-2024-11, no_strip: false, ias: 1, cross: "", clang: r450784e }
          - { kmi: android14-6.1,  branch: android14-6.1,  no_strip: false, ias: 1, cross: "", clang: "" }
          - { kmi: android15-6.6,  branch: android15-6.6,  no_strip: true, ias: 1, cross: "", clang: "" }
          - { kmi: android16-6.12, branch: android16-6.12, no_strip: true, ias: 1, cross: "", clang: "" }

    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: lsdriver-src

      - name: Restore kernel cache
        uses: actions/cache/restore@v4
        with:
          path: kernel
          key: kernel-${{ matrix.branch }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ matrix.branch }}-

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld bc bison flex \
            libssl-dev libelf-dev dwarves libdw-dev libdwarf-dev elfutils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Restore clang cache
        if: matrix.clang != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/clang-matched
          key: clang-r450784e-mirror-v1

      - name: Setup matched AOSP clang (${{ matrix.clang }})
        if: matrix.clang != ''
        run: |
          DEST="$HOME/clang-matched"
          if [ ! -x "$DEST/bin/clang" ]; then
            rm -rf "$DEST"
            echo "== cloning matched clang r450784e (build 8508608) from GitHub mirror =="
            git clone --depth 1 \
              https://github.com/LeafOS-experimental/android_prebuilts_clang_kernel_linux-x86_clang-r450784e \
              "$DEST" || echo "!! github mirror clone failed"
          fi
          if [ ! -x "$DEST/bin/clang" ]; then
            echo "== github mirror unavailable, trying AOSP googlesource =="
            git clone --depth 1 --filter=blob:none --sparse \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$HOME/prebuilts-clang" 2>/dev/null || true
            ( cd "$HOME/prebuilts-clang" && git sparse-checkout set ${{ matrix.clang }} 2>/dev/null ) || true
            DEST="$HOME/prebuilts-clang/${{ matrix.clang }}"
          fi
          if [ -x "$DEST/bin/clang" ]; then
            echo "== matched clang ready =="
            "$DEST/bin/clang" --version | head -2
            echo "MATCHED_CLANG_BIN=$DEST/bin" >> "$GITHUB_ENV"
          else
            echo "!!!!!!!!!! MATCHED CLANG NOT AVAILABLE - FALLING BACK TO SYSTEM CLANG !!!!!!!!!!"
          fi

      - name: Checkout KMI kernel (${{ matrix.kmi }})
        run: |
          if [ ! -f kernel/Makefile ]; then
            rm -rf kernel
            # 优先 GitHub 镜像(网络快); googlesource 作后备
            git clone --depth 2000 \
              https://github.com/aosp-mirror/kernel_common \
              -b ${{ matrix.branch }} \
              kernel 2>/dev/null || \
            ( rm -rf kernel && \
              git clone --depth 2000 \
                https://android.googlesource.com/kernel/common \
                -b ${{ matrix.branch }} \
                kernel )
          else
            echo "kernel cache hit, skip clone"
          fi
          cd kernel
          if [ "${{ matrix.kmi }}" = "android13-5.15" ]; then
            C=$(git log --format=%H --grep="5.15.167" -1 2>/dev/null || true)
            if [ -n "$C" ]; then
              git checkout "$C" 2>/dev/null || true
              echo "checked out: $C"
            else
              echo "5.15.167 not in depth, using branch HEAD"
            fi
            grep -m1 -E "SUBLEVEL|PATCHLEVEL" Makefile || true
          fi
          git log --oneline -1

      - name: Prepare kernel build
        run: |
          cd kernel
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} gki_defconfig
          # 关闭 rust 相关(部分版本 defconfig 带且 runner 工具链不匹配)
          ./scripts/config --file .config -d RUST -d RUST_BUILD_ASSERT_ALLOW || true
          # 关闭 BTF: 绕过 BTF 生成失败, 省内存/磁盘 (模块符号表不依赖 BTF)
          ./scripts/config --file .config -d DEBUG_INFO_BTF || true
          ./scripts/config --file .config -e DEBUG_INFO_NONE || true
          # ★ 关键修复: 不再禁用 LTO/CFI ★
          # android13-5.15 的 CONFIG_CFI_CLANG 依赖 CONFIG_LTO_CLANG; 之前为绕 vmlinux OOM
          # 关闭 LTO 后 olddefconfig 会连带禁用 CFI, 模块失去 .cfi_jt 跳板与 func note,
          # 带 CFI/LTO/BTI 的目标内核通过 BLR 加载驱动时校验失败 -> 直接死机。
          # 现在保持 gki_defconfig 原样的 LTO_CLANG_FULL + CFI_CLANG + SHADOW_CALL_STACK + BTI,
          # 并且不再构建 vmlinux(不链接就不会 OOM), 只做 modules_prepare。
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} olddefconfig
          echo "== CFI/LTO 状态校验 (android13-5.15 必须 CFI_CLANG=y) =="
          grep -E "CONFIG_(LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN|CFI_CLANG|SHADOW_CALL_STACK|ARM64_BTI_KERNEL|ARM64_PTR_AUTH_KERNEL|MODVERSIONS)=" .config || true
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} -j$(nproc) prepare modules_prepare \
            2>&1 | tee prepare.log

      - name: Build lsdriver.ko (PTE only, keep CFI/LTO)
        run: |
          cd kernel
          # 不构建完整内核: 避免 FULL LTO 链接 vmlinux 在 16GB runner 上 OOM(exit 143)。
          # 删掉残留 Module.symvers -> 模块 __versions 为空(与上游发行 ko 一致, 目标内核放行/跳过 CRC)。
          rm -f Module.symvers
          PATH="$MATCHED_CLANG_BIN:$PATH" make LLVM=1 LLVM_IAS=${{ matrix.ias }} ARCH=arm64 CROSS_COMPILE=${{ matrix.cross }} -j$(nproc) \
            M=${{ github.workspace }}/lsdriver-src/lsdriver \
            KBUILD_MODPOST_WARN=1 CONFIG_EXTENDED_MODVERSIONS=n \
            modules 2>&1 | tee mod.log

      - name: Verify CFI instrumentation in ko
        if: always()
        run: |
          KO=$(find "${{ github.workspace }}/lsdriver-src" -name "lsdriver.ko" | head -1)
          if [ -z "$KO" ]; then echo "ko not found, skip verification"; exit 0; fi
          echo "== ko: $KO =="
          echo "-- cfi / init_module symbols --"
          llvm-nm "$KO" 2>/dev/null | grep -iE "cfi|init_module" | head -14 || true
          echo "-- cfi / versions / note sections --"
          llvm-readelf -S "$KO" 2>/dev/null | grep -iE "cfi|versions|\.note" || true
          echo "-- .note.Linux raw (func note 末4字节应为 01 00 00 00) --"
          llvm-readelf -x .note.Linux "$KO" 2>/dev/null | tail -3 || true
          HW=$(find "${{ github.workspace }}/lsdriver-src" -name "helloworld_test.ko" | head -1)
          if [ -n "$HW" ]; then
            echo "== helloworld_test.ko: CFI 检查 =="
            llvm-nm "$HW" 2>/dev/null | grep -iE "cfi" | head -6 || true
            llvm-readelf -x .note.Linux "$HW" 2>/dev/null | tail -2 || true
          fi

      - name: Collect errors to summary + errors branch (on failure)
        if: failure()
        run: |
          {
            echo "## ${{ matrix.kmi }} build failure"
            for f in prepare.log mod.log build.log; do
              if [ -f "kernel/$f" ]; then
                echo "=== $f (errors) ==="
                grep -nE "error:|Error [0-9]|undefined reference|No rule to make|fatal|\*\*\*|FAILED:" \
                  "kernel/$f" | tail -50
                echo "--- tail ---"
                tail -60 "kernel/$f"
              fi
            done
          } > /tmp/summary.md || true
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cd "${{ github.workspace }}/lsdriver-src"
          git config user.name "ci-bot"
          git config user.email "ci@localhost"
          git checkout --orphan "errors/${{ matrix.kmi }}" 2>/dev/null || true
          git rm -rf . 2>/dev/null || true
          cp /tmp/summary.md ./summary.md
          git add summary.md
          git commit -m "build errors ${{ matrix.kmi }}" || true
          git push --force origin "errors/${{ matrix.kmi }}" 2>&1 | tail -2 || true

      - name: Diagnose undefined symbols (on failure)
        if: failure()
        run: |
          echo "=== undefined symbol owners ==="
          for o in $(find "$GITHUB_WORKSPACE/lsdriver-src" -name "*.o" 2>/dev/null); do
            out=$(llvm-nm -u "$o" 2>/dev/null | grep -E "sme_|mmu_notifier|arch_invalidate|cfi")
            if [ -n "$out" ]; then
              echo "### $o"
              echo "$out"
            fi
          done
          echo "=== full undefined list of lsdriver_main.o ==="
          llvm-nm -u "$GITHUB_WORKSPACE/lsdriver-src/lsdriver/lsdriver_main.o" 2>/dev/null | head -50

      - name: Strip
        run: |
          KO=$(find "${{ github.workspace }}/lsdriver-src" -name "lsdriver.ko" | head -1)
          if [ -z "$KO" ]; then
            echo "lsdriver.ko not found, searching whole workspace"
            find "${{ github.workspace }}" -name "lsdriver.ko" | head -5
          fi
          if [ "${{ matrix.no_strip }}" = "true" ]; then
            echo "no-strip KMI, keeping symbols"
          else
            llvm-strip --strip-debug "$KO" || strip --strip-debug "$KO"
          fi
          mkdir -p out
          cp "$KO" "out/lsdriver-${{ matrix.kmi }}.ko"
          HW=$(find "${{ github.workspace }}/lsdriver-src" -name "helloworld_test.ko" | head -1)
          if [ -n "$HW" ]; then cp "$HW" "out/helloworld_test-${{ matrix.kmi }}.ko"; fi
          ls -la out/

      - name: Save clang cache
        if: matrix.clang != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/clang-matched
          key: clang-r450784e-mirror-v1

      - name: Save kernel cache (always, so failed runs reuse it)
        if: always() && hashFiles('kernel/Makefile') != ''
        uses: actions/cache/save@v4
        with:
          path: kernel
          key: kernel-${{ matrix.branch }}-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-${{ matrix.kmi }}
          path: out/
